<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=390,initial-scale=1"/><title>Settlement A — reckoning</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"><style>
  :root{--green:#236651;--green-2:#1A4D3D;--green-3:#143728;--green-soft:#E5EEEA;--paper:#FFFFFF;--paper-2:#FAFAF7;--paper-warm:#F6F2E8;--ink:#1B1B1B;--ink-mid:#454545;--mid:#6B6B6B;--muted:#9A9A95;--hair:#E5E2DA;--hair-soft:#EFEDE6;--oxblood:#C8312D;--navy:#1E54B0;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
  html,body{font-family:"Roboto",system-ui,sans-serif;color:var(--ink);background:#0c0c0e;font-feature-settings:"tnum"}
  body{display:flex;flex-wrap:wrap;gap:36px;justify-content:center;align-items:flex-start;min-height:100vh;padding:40px 20px}
  .phone{width:390px;min-height:844px;background:var(--paper);position:relative;overflow:hidden}
  .status-fill{position:absolute;top:0;left:0;right:0;height:54px;background:var(--green);z-index:0}
  .status{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:14px 22px 0;font-weight:500;font-size:13px;color:#fff}
  .status .dots{display:flex;gap:4px}.status .dots span{width:14px;height:6px;background:#fff;border-radius:2px}
  .header{position:relative;z-index:3;background:var(--green);color:#fff;padding:14px 22px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;box-shadow:0 5px 16px -10px rgba(20,55,40,.55)}
  .crest{width:48px;height:48px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .crest svg{width:100%;height:100%;object-fit:contain;display:block}
  .wordmark .name{display:block;text-align:center;font-family:"Cormorant Garamond";font-style:italic;font-weight:500;font-size:24px;color:#fff;letter-spacing:.005em;white-space:nowrap}
  .hslot{width:48px;height:48px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .hslot .fin{font-family:"Roboto";font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.5);border-radius:99px;padding:4px 8px}
  .label{font-family:"Roboto";font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mid);font-weight:600}
  .leaf-wm{position:absolute;left:50%;transform:translateX(-50%);opacity:.05;z-index:0;pointer-events:none}
  .leaf-wm svg{width:100%;height:auto;display:block}
  .btn{font-family:"Cormorant Garamond";font-style:italic;font-weight:600;cursor:pointer;border-radius:2px;line-height:1;display:flex;align-items:center;justify-content:center;gap:10px}
  .btn.primary{background:var(--green);color:var(--paper-warm);border:1px solid var(--green-3);font-size:20px;padding:15px 22px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 1px 0 var(--green-3),0 6px 16px -8px rgba(35,102,81,.4)}
  .btn.ghost{background:var(--paper-warm);color:var(--ink-mid);border:1.5px solid var(--hair);font-size:16px;padding:14px 18px}

  .shot{position:relative;z-index:2;padding:30px 22px 24px;text-align:center}
  .shot .kick{font-family:"Roboto";font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--mid);font-weight:600}
  .shot .owe{font-family:"Cormorant Garamond";font-style:italic;font-weight:500;font-size:26px;color:var(--ink);margin-top:12px;line-height:1.1}
  .shot .owe b{font-style:normal;font-weight:700;color:var(--oxblood)}
  .shot .amt{font-family:"Cormorant Garamond";font-weight:500;font-size:104px;line-height:.9;color:var(--oxblood);letter-spacing:-.03em;margin-top:6px;font-variant-numeric:tabular-nums lining-nums}
  .ledger{position:relative;z-index:2;margin:0 22px;border-top:1px solid var(--hair)}
  .lr{display:flex;align-items:baseline;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--hair-soft)}
  .lr .lk{font-family:"Cormorant Garamond";font-style:italic;font-weight:500;font-size:18px;color:var(--ink-mid)}
  .lr .lv{font-family:"Roboto";font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mid);font-weight:600;display:flex;align-items:baseline;gap:8px}
  .lr .lv b{font-family:"Cormorant Garamond";font-style:normal;font-weight:600;font-size:18px;letter-spacing:0;text-transform:none}
  .lr .lv b.red{color:var(--oxblood)}
  .lr.total{border-bottom:2px solid var(--ink)}
  .lr.total .lk{font-style:normal;font-weight:600;color:var(--ink);font-size:19px}
  .lr.total .lv b{color:var(--oxblood);font-size:22px}
  .biggame{position:relative;z-index:2;margin:18px 22px 0;padding:14px 16px;border:1px solid var(--hair);border-radius:6px;background:var(--paper-2);display:flex;align-items:center;justify-content:space-between}
  .biggame .bl .t{font-family:"Cormorant Garamond";font-style:italic;font-weight:600;font-size:17px;color:var(--ink)}
  .biggame .bl .s{font-family:"Roboto";font-size:10.5px;color:var(--mid);margin-top:2px;letter-spacing:.04em}
  .biggame .bv{font-family:"Cormorant Garamond";font-weight:600;font-size:34px;color:var(--green);line-height:1;font-variant-numeric:tabular-nums lining-nums}
  .foot{position:absolute;left:0;right:0;bottom:0;padding:14px 22px 28px;background:var(--paper);border-top:1px solid var(--hair);display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
