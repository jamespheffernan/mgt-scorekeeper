name: MGTScorekeeper
options:
  minimumXcodeGenVersion: 2.43.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MGTScorekeeper:
    type: application
    platform: iOS
    sources:
      - MGTScorekeeper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamesheffernan.MGTScorekeeper
        CODE_SIGN_STYLE: Automatic
    info:
      path: MGTScorekeeper/Supporting/Info.plist
      properties:
        CFBundleDisplayName: MGT Scorekeeper
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  MGTScorekeeperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MGTScorekeeperTests
    info:
      path: MGTScorekeeperTests/Info.plist
      properties:
        CFBundleIdentifier: com.jamesheffernan.MGTScorekeeperTests
    dependencies:
      - target: MGTScorekeeper
